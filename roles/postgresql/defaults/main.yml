---
postgresql_server_enabled: "{{ workstation_role == 'server' }}"

postgresql_packages:
  - postgresql
  - python3-psycopg2

postgresql_service_name: postgresql
postgresql_socket_directory: /var/run/postgresql
postgresql_pg_hba_path: ""
postgresql_listen_addresses: localhost

postgresql_users: []
postgresql_databases: []

postgresql_hba_rules:
  - contype: local
    databases: all
    users: all
    method: peer
    comment: Local Unix socket connections

  - contype: host
    databases: all
    users: all
    address: 127.0.0.1/32
    method: md5
    comment: Local IPv4 connections

  - contype: host
    databases: all
    users: all
    address: ::1/128
    method: scram-sha-256
    comment: Local IPv6 connections

  - contype: local
    databases: replication
    users: all
    method: peer
    comment: Local replication connections

  - contype: host
    databases: replication
    users: all
    address: 127.0.0.1/32
    method: scram-sha-256
    comment: Local IPv4 replication connections

  - contype: host
    databases: replication
    users: all
    address: ::1/128
    method: scram-sha-256
    comment: Local IPv6 replication connections

postgresql_hba_additional_rules: []
