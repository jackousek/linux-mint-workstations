---
- name: Reload PostgreSQL
  ansible.builtin.systemd_service:
    name: "{{ postgresql_service_name }}"
    state: reloaded
  when: postgresql_server_enabled | bool

- name: Restart PostgreSQL
  ansible.builtin.systemd_service:
    name: "{{ postgresql_service_name }}"
    state: restarted
  when: postgresql_server_enabled | bool
