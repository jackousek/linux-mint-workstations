---
- name: Ensure Thunderbird is installed
  ansible.builtin.apt:
    name: thunderbird
    state: present

- name: Check Thunderbird email configuration
  ansible.builtin.assert:
    that:
      - thunderbird_email_address | default('') | length > 0
      - thunderbird_display_name | default('') | length > 0
      - thunderbird_imap_host | default('') | length > 0
      - thunderbird_imap_port is defined
      - thunderbird_smtp_host | default('') | length > 0
      - thunderbird_smtp_port is defined
    fail_msg: "Thunderbird email configuration is incomplete."
  when: thunderbird_email_username | default('') | trim | length > 0

- name: Install Thunderbird AutoConfig loader
  ansible.builtin.copy:
    dest: /usr/lib/thunderbird/defaults/pref/autoconfig.js
    content: |
      pref("general.config.filename", "thunderbird.cfg");
      pref("general.config.obscure_value", 0);
    owner: root
    group: root
    mode: "0644"
  when: thunderbird_email_username | default('') | trim | length > 0

- name: Install Thunderbird AutoConfig
  ansible.builtin.template:
    src: thunderbird.cfg.j2
    dest: /usr/lib/thunderbird/thunderbird.cfg
    owner: root
    group: root
    mode: "0644"
  when: thunderbird_email_username | default('') | trim | length > 0

- name: Remove Thunderbird AutoConfig when email is not configured
  ansible.builtin.file:
    path: "{{ item }}"
    state: absent
  loop:
    - /usr/lib/thunderbird/defaults/pref/autoconfig.js
    - /usr/lib/thunderbird/thunderbird.cfg
  when: thunderbird_email_username | default('') | trim | length == 0

- name: Remove obsolete Thunderbird UI helper
  ansible.builtin.file:
    path: /usr/local/libexec/thunderbird-configure-ui.py
    state: absent
